# Render Blueprint: managed PostgreSQL + Node API. Repo root = this app/ folder.
databases:
  - name: bloom-db
    plan: basic-256mb          # free Postgres is deleted after 30 days; use a paid plan for real data
    region: singapore          # closest Render region to India
    databaseName: bloom
    user: bloom

services:
  - type: web
    name: bloom-timesheet-api  # if taken, pick another and update client/vercel.json to match
    runtime: node
    region: singapore          # keep in the same region as the database
    plan: starter              # free web services sleep when idle: login codes would be slow/unreliable
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: bloom-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "2"             # Vercel -> Render
      - key: APP_URL
        sync: false            # your Vercel URL, e.g. https://timesheet.bloom-india.com
      - key: ALLOWED_EMAIL_DOMAIN
        value: bloom-india.com
      - key: ADMIN_EMAIL
        value: ankit.kumar@bloom-india.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: Bloom Timesheet <no-reply@bloom-india.com>
